server:
  port: 9000

spring:
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:9000

  datasource:
    # Supabase Session Pooler Configuration
    # pool_mode: session (port 5432) - Better for Hibernate with prepared statements
    url: jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:5432/postgres
    username: postgres.aqvcbjvtxqvzzruaourx
    password: 1thisis@!password
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  # SMTP Email Configuration
  mail:
    host: smtp.gmail.com  # Change to your SMTP server
    port: 587
    username: ${SMTP_USERNAME:your-email@gmail.com}  # Set via environment variable
    password: ${SMTP_PASSWORD:your-app-password}  # Set via environment variable
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    from: ${SMTP_FROM:no-reply@identity-service.com}  # Sender email address

# Application Configuration
app:
  base-url: http://localhost:9000  # Base URL for email links

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  info:
    title: Identity Service API
    description: Identity and Access Management Service with OAuth2/OIDC support
    version: v1.0
